name: CI

# Make "check" a required status check on main's branch protection rule so
# nothing merges with a type error, lint failure or broken test. Also runs
# on epic/* branches, which get the same gate long before reaching main.
on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request's branch makes its older run pointless:
# stacked PRs get main merged in often, and the old runs used to queue up
# behind each other. Runs on main are never cancelled, so every commit
# there is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types and the build don't need the tests, so they run beside them.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next typegen` writes the route types (LayoutProps etc.) that tsc
      # needs on a fresh checkout — far cheaper than a full build.
      - run: npm run typecheck
      # No secrets needed: the DB client and session secret are read lazily,
      # and every page is dynamic, so the build never touches a database.
      - run: npm run build

  # The tests, split across two runners. Most of the time is the files
  # themselves (each boots its own PGlite), so two halves take about half
  # as long, and each runner holds half the databases. Every half applies
  # drizzle/ to an in-process Postgres, so a broken migration fails here
  # rather than on a real database.
  #
  # The memory monitor added after the out-of-memory kills of 2026-10-31
  # is gone: testDb() closing each test's database fixed them, and runs
  # since peaked near 4GB of 16GB. If a run is killed again, the step below
  # still says whether the kernel's out-of-memory killer did it.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/2
      - name: Out-of-memory kills
        if: failure()
        run: sudo dmesg | grep -iE "out of memory|oom-kill|killed process" || echo "No out-of-memory kills logged."

  # The one status to require: green only when everything above is.
  check:
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "static: ${{ needs.static.result }}, test: ${{ needs.test.result }}"
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.test.result }}" = success ]
